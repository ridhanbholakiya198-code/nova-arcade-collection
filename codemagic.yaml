workflows:
  android-release:
    name: Nova Arcade Android Release
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      node: 22
      java: 21
      groups:
        - ayuguard_release
      vars:
        CM_KEYSTORE_PATH: /tmp/keystore/release.keystore
    scripts:
      - name: Install npm dependencies
        script: |
          rm -rf node_modules package-lock.json
          npm install --include=optional
      - name: Build web assets
        script: npm run build
      - name: Sync Capacitor Android
        script: npx cap sync android
      - name: Set up Android SDK
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
      - name: Decode release keystore
        script: |
          mkdir -p "$(dirname "$CM_KEYSTORE_PATH")"
          echo "$CM_KEYSTORE" | base64 --decode > "$CM_KEYSTORE_PATH"
      - name: Build Android Release
        script: |
          cd android
          ./gradlew assembleRelease --no-daemon
    artifacts:
      - android/app/build/outputs/apk/release/**/*.apk
    publishing:
      email:
        recipients:
          - rbholakiya@gmail.com
